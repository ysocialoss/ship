services:
  postgres:
    image: postgres:17-alpine
    container_name: ship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ship}
      POSTGRES_DB: ${POSTGRES_DB:-ship}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ship} -d ${POSTGRES_DB:-ship}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
